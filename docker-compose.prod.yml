version: "3.8"

volumes:
  backend_storage:

services:
  dsl_backend:
    container_name: dsl_backend_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: always

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-tds}

      # SSO_BASE_URL: ${SSO_BASE_URL:-http://host.docker.internal:5000}
      # SSO_FRONTEND_URL: ${SSO_FRONTEND_URL:-http://localhost:5173}
      # SSO_CLIENT_ID: ${SSO_CLIENT_ID:-client_29f1ebacc189d8f2162d95ea63acd6a5}
      # SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-b919281f18a32cc008ba63016f7d89042bb006f1ae5f0748ab83049a1d8698d4}
      # SSO_CALLBACK_URL: ${SSO_CALLBACK_URL:-https://pe.spil.co.id/tds-api/api/auth/sso/callback}
      # FRONTEND_URL: ${FRONTEND_URL:-https://pe.spil.co.id/tds}

      WEB_PORT: 8080
      ENV: production
      GIN_MODE: release

      JWT_SECRET_KEY: ${JWT_SECRET}

      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://pe.spil.co.id/dsl-api}

    volumes:
      - backend_storage:/app/storage

    expose:
      - "8080"

    networks:
      - traefik-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.dsl-backend.rule=Host(`pe.spil.co.id`) && PathPrefix(`/dsl-api`)"
      - "traefik.http.routers.dsl-backend.entrypoints=websecure"
      - "traefik.http.routers.dsl-backend.tls=true"
      - "traefik.http.routers.dsl-backend.middlewares=strip-dsl-api"
      - "traefik.http.middlewares.strip-dsl-api.stripprefix.prefixes=/dsl-api"
      - "traefik.http.services.dsl-backend.loadbalancer.server.port=8080"

  dsl_frontend:
    container_name: dsl_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-https://pe.spil.co.id/dsl-api}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}

    env_file: .env
    restart: always

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-https://pe.spil.co.id/dsl-api}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      dsl_backend:
        condition: service_healthy

    networks:
      - traefik-net

    expose:
      - "3000"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.dsl-frontend.rule=Host(`pe.spil.co.id`) && PathPrefix(`/dsl`)"
      - "traefik.http.routers.dsl-frontend.entrypoints=websecure"
      - "traefik.http.routers.dsl-frontend.tls=true"
      - "traefik.http.routers.dsl-frontend.middlewares=strip-dsl"
      - "traefik.http.middlewares.strip-dsl.stripprefix.prefixes=/dsl"
      - "traefik.http.services.dsl-frontend.loadbalancer.server.port=3000"

networks:
  traefik-net:
    name: traefik-net
    external: true
