volumes:
  backend_storage:

services:
  dsl_backend:
    container_name: dsl_backend_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-digital_logbook}

      FRONTEND_URL: ${FRONTEND_URL:-https://px.spil.co.id/dsl}
      WEB_PORT: 8080
      ENV: production
      GIN_MODE: release

      JWT_SECRET_KEY: ${JWT_SECRET}

      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-https://px.spil.co.id/dsl-api}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      UPLOAD_DIR: ${UPLOAD_DIR:-storage/uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}

    volumes:
      - backend_storage:/app/storage

    expose:
      - "8080"

    networks:
      - traefik-net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.dsl-backend.rule=Host(`px.spil.co.id`) && PathPrefix(`/dsl-api`)"
      - "traefik.http.routers.dsl-backend.entrypoints=websecure"
      - "traefik.http.routers.dsl-backend.tls=true"
      - "traefik.http.routers.dsl-backend.priority=200"
      - "traefik.http.routers.dsl-backend.middlewares=strip-dsl-api"
      - "traefik.http.middlewares.strip-dsl-api.stripprefix.prefixes=/dsl-api"
      - "traefik.http.services.dsl-backend.loadbalancer.server.port=8080"

  dsl_frontend:
    container_name: dsl_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-https://px.spil.co.id/dsl-api}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/dsl}

    restart: always

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:-https://px.spil.co.id/dsl-api}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/dsl}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      dsl_backend:
        condition: service_healthy

    networks:
      - traefik-net

    expose:
      - "3000"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.dsl-frontend.rule=Host(`px.spil.co.id`) && PathPrefix(`/dsl`)"
      - "traefik.http.routers.dsl-frontend.entrypoints=websecure"
      - "traefik.http.routers.dsl-frontend.tls=true"
      - "traefik.http.routers.dsl-frontend.priority=100"
      - "traefik.http.services.dsl-frontend.loadbalancer.server.port=3000"

networks:
  traefik-net:
    name: traefik-net
    external: true
